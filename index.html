<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="google-site-verification" content="xRiPs1vtfGL2PWGF-AMniSXhsh2eAdY0JQvnDYRU9yY" />
  <title>Netflix Clone</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="hero">

    <nav>
      <img class="logo"
      src="https://upload.wikimedia.org/wikipedia/commons/7/75/Netflix_icon.svg">

      <button class="signin-btn">Sign In</button>
    </nav>

    <div class="content">
      <h1>Unlimited movies, TV shows and more</h1>

      <h3>Watch anywhere. Cancel anytime.</h3>

      <p>Ready to watch? Enter your email to create or restart your membership.</p>

      <div class="email-box">
        <input type="email" placeholder="Enter your email">
        <button onclick="showMessage()">Get Started ></button>
      </div>
      
    </div>

  </section>

  <section class="movies">

    <h2>Trending Now</h2>

    <div class="movie-row">

      <img src="https://wallpapercave.com/wp/wp4056410.jpg">

      <img src="https://wallpapercave.com/wp/wp1917154.jpg">

      <img src="https://wallpapercave.com/wp/wp6751663.jpg">

      <img src="https://wallpapercave.com/wp/wp4056411.jpg">

      <img src="https://wallpapercave.com/wp/wp4056407.jpg">

    </div>

  </section>

  <footer>
    <p>Netflix Clone © 2026</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
